name: ki-radar-local
services:
  db:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: ki_radar
      POSTGRES_USER: ki_radar
      POSTGRES_PASSWORD: ki_radar_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - local_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ki_radar -d ki_radar"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ki_radar
      POSTGRES_USER: ki_radar
      POSTGRES_PASSWORD: ki_radar_local
      DJANGO_SECRET_KEY: local-development-only
      ANONYMIZATION_LEDGER_PATH: /app/var/anonymization-ledger.jsonl
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - local_venv:/app/.venv
      - local_var:/app/var
    depends_on:
      db:
        condition: service_healthy
volumes:
  local_db:
  local_venv:
  local_var:
