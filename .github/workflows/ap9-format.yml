name: Format AP 9

on:
  push:
    branches:
      - issue-120-ap9-golden-regression

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-120-ap9-golden-regression
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - run: uv sync --frozen --dev
      - run: uv run ruff format tests/test_capture_analysis_golden.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_capture_analysis_golden.py
          git commit -m "style(ap9): format golden regression tests"
          git push origin HEAD:issue-120-ap9-golden-regression
