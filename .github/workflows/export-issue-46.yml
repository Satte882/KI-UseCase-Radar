name: Diagnose Issue 46

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: ki_radar_test
          POSTGRES_USER: ki_radar
          POSTGRES_PASSWORD: ki_radar_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ki_radar -d ki_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      POSTGRES_DB: ki_radar_test
      POSTGRES_USER: ki_radar
      POSTGRES_PASSWORD: ki_radar_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://ki_radar:ki_radar_test_password@localhost:5432/ki_radar_test
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Apply validated implementation payload
        shell: bash
        run: |
          set -euo pipefail
          cat .issue46-chunks/chunk-* > /tmp/issue46.b64
          test "$(wc -c < /tmp/issue46.b64)" = "36756"
          echo "a9d8dd1674980eaede3ba3edc7995e8e78d6434957f50d3dc974335bc1e316d1  /tmp/issue46.b64" | sha256sum --check
          base64 --decode /tmp/issue46.b64 > /tmp/issue46.tar.gz
          echo "d6c8ad0e05cbb40d7bf26b45de67d19b04fc70eba9e3667ef62146e27be0a625  /tmp/issue46.tar.gz" | sha256sum --check
          tar -xzf /tmp/issue46.tar.gz

      - name: Format and migrate
        run: |
          uv run ruff format ki_radar tests
          uv run python manage.py makemigrations governance --name governance_review_artifacts
          uv run python manage.py migrate --noinput

      - name: Run first failing regression
        run: >-
          uv run pytest -q --tb=short -x
          tests/test_governance.py
          tests/test_issue_62_governance_review_flow.py
          tests/test_guided_intake_hard_gates.py
          tests/test_issue_61_blocked_decision_form.py
