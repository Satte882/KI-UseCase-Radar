name: Export Issue 46 Source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source archive
        run: zip -qr issue-46-source.zip . -x '.git/*'

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: issue-46-source
          path: issue-46-source.zip
          if-no-files-found: error
