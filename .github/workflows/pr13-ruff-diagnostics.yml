name: PR13 Ruff Formatter

on:
  push:
    branches: [feature/delivery-handover]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/delivery-handover
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --frozen --dev
      - name: Apply Ruff formatter
        run: |
          uv run ruff format \
            ki_radar/delivery/models.py \
            ki_radar/delivery/services.py \
            ki_radar/delivery/views.py \
            tests/test_delivery_handover.py
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ki_radar/delivery/models.py \
            ki_radar/delivery/services.py \
            ki_radar/delivery/views.py \
            tests/test_delivery_handover.py
          git commit -m "Apply Ruff formatting to delivery handover"
          git push origin HEAD:feature/delivery-handover
