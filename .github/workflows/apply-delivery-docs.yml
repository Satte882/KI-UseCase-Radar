name: Apply Delivery Readiness Documentation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Update README and roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          old = "Für den Status **Bereit zur Übergabe** müssen Architektur- und Übergabepunkte konkret beschrieben oder ausdrücklich als nicht relevant dokumentiert sein. Leere Integrationen, Abhängigkeiten, Risiken, Annahmen oder Architekturentscheidungen gelten nicht automatisch als ausreichend."
          new = old + "\n\nDelivery Readiness 2.0 gliedert das Package in sieben prüfbare Sektionen. Automatisch übernommene Inhalte bleiben als Herkunft sichtbar und müssen fachlich beziehungsweise technisch bestätigt werden. Strukturierte Readiness-Findings benennen konkrete Blocker; die Prüfung wird vor der verbindlichen Übergabe erneut serverseitig ausgeführt.\n\nDie vollständige methodische Grundlage ist in [Delivery Methodology](docs/DELIVERY_METHODOLOGY.md) hinterlegt. In-App-Ansicht und Markdown-Download verwenden dieselbe versionierte Datei; KI-Radar führt dadurch keinen zusätzlichen CRISP-ML(Q)-Workflow und keine automatische ML-Test-Score-Berechnung ein."
          if old not in content:
              raise SystemExit("README delivery anchor not found")
          readme.write_text(content.replace(old, new, 1), encoding="utf-8")

          roadmap = Path("docs/ROADMAP.md")
          content = roadmap.read_text(encoding="utf-8")
          content = content.replace("**Stand:** 22.07.2026", "**Stand:** 23.07.2026", 1)
          anchor = "- [x] **22.07.2026:** Link zum externen Delivery-System"
          addition = anchor + "\n- [x] **23.07.2026:** sieben strukturierte Delivery-Sektionen mit Herkunft, Prüfstatus und fachlicher beziehungsweise technischer Bestätigung\n- [x] **23.07.2026:** Quellenmanifest aus Use Case, Discovery, Bewertung und Freigabe\n- [x] **23.07.2026:** vertiefter System-, Daten- und Integrationskontext einschließlich Systemverantwortung, Datenzugriff und Fehlerbehandlung\n- [x] **23.07.2026:** strukturierte Readiness-Findings und erneute serverseitige Prüfung vor der Übergabe\n- [x] **23.07.2026:** Legacy-Bestandsschutz über Readiness-Schemaversionen\n- [x] **23.07.2026:** vollständige methodische Referenz CRISP-ML(Q) mit integriertem ML Test Score, In-App-Ansicht und identischem Markdown-Download"
          if anchor not in content:
              raise SystemExit("Roadmap delivery anchor not found")
          roadmap.write_text(content.replace(anchor, addition, 1), encoding="utf-8")
          PY
      - name: Commit documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ROADMAP.md
          git commit -m "docs(delivery): record readiness v2 completion"
          git push origin HEAD:${{ github.head_ref }}
