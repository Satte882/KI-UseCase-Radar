name: Lint Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked --dev --quiet
      - name: Capture lint output
        shell: bash
        run: |
          set +e
          uv run ruff check . > lint-output.txt 2>&1
          printf '%s\n' "$?" > lint-exit-code.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostic
          path: |
            lint-output.txt
            lint-exit-code.txt
          if-no-files-found: error
