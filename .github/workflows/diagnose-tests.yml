name: Apply Legacy Readiness Compatibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Patch legacy missing-field display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ki_radar/delivery/readiness.py")
          content = path.read_text(encoding="utf-8")
          old = """def missing_ready_fields(package: DeliveryPackage) -> list[str]:
              return [finding.message for finding in blocking_findings(package)]
          """
          old = "\n".join(line[14:] if line.startswith("              ") else line for line in old.splitlines()) + "\n"
          new = """def _legacy_missing_ready_fields(package: DeliveryPackage) -> list[str]:
              legacy_fields = (
                  "problem_context",
                  "target_outcome",
                  "in_scope",
                  "out_of_scope",
                  "users_and_scenarios",
                  "solution_outline",
                  "system_context",
                  "data_context",
                  "functional_requirements",
                  "non_functional_requirements",
                  "security_privacy_requirements",
                  "human_oversight",
                  "logging_and_audit",
                  "operations_and_support",
                  "mvp_scope",
                  "acceptance_criteria",
                  "test_scenarios",
                  "measurement_plan",
                  "initial_backlog",
                  "integrations",
                  "dependencies",
                  "risks",
                  "assumptions",
                  "architecture_decisions",
              )
              missing = [
                  _field_label(package, field_name)
                  for field_name in legacy_fields
                  if not _text(getattr(package, field_name, ""))
              ]
              artifacts = get_delivery_architecture_artifacts(package)
              if artifacts is None:
                  missing.extend(
                      [
                          "Ist-/Ziel-Systemlandschaft",
                          "Daten- und Informationsflüsse",
                          "Integrationsverträge und Verantwortlichkeiten",
                      ]
                  )
              else:
                  legacy_artifact_fields = {
                      "system_landscape": "Ist-/Ziel-Systemlandschaft",
                      "data_flows": "Daten- und Informationsflüsse",
                      "integration_contracts": "Integrationsverträge und Verantwortlichkeiten",
                  }
                  for field_name, label in legacy_artifact_fields.items():
                      if not _text(getattr(artifacts, field_name, "")):
                          missing.append(label)
              return list(dict.fromkeys(missing))


          def missing_ready_fields(package: DeliveryPackage) -> list[str]:
              if package.readiness_schema_version < 2:
                  return _legacy_missing_ready_fields(package)
              return [finding.message for finding in blocking_findings(package)]
          """
          new = "\n".join(line[14:] if line.startswith("              ") else line for line in new.splitlines()) + "\n"
          if old not in content:
              raise SystemExit("Expected missing_ready_fields block not found")
          path.write_text(content.replace(old, new), encoding="utf-8")
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ki_radar/delivery/readiness.py
          git commit -m "fix(delivery): preserve legacy missing-field display"
          git push origin HEAD:${{ github.head_ref }}
