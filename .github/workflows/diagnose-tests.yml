name: Apply Readiness Compatibility Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Add compatibility wrapper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ki_radar/delivery/readiness.py")
          content = path.read_text(encoding="utf-8")
          marker = "def render_delivery_markdown(package: DeliveryPackage) -> str:"
          if marker not in content:
              content += '''\n\ndef render_delivery_markdown(package: DeliveryPackage) -> str:\n    """Compatibility wrapper for callers of the former readiness export."""\n\n    from .exports import render_delivery_markdown as render\n\n    return render(package)\n'''
              path.write_text(content, encoding="utf-8")
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ki_radar/delivery/readiness.py
          git commit -m "fix(delivery): preserve readiness export compatibility"
          git push origin HEAD:${{ github.head_ref }}
