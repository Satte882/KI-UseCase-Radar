name: PR Lint Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - run: python -m pip install --quiet "ruff>=0.12,<1"
      - name: Capture Ruff output
        shell: bash
        run: |
          set +e
          ruff check . > ruff-output.txt 2>&1
          printf '%s\n' "$?" > ruff-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-output
          path: |
            ruff-output.txt
            ruff-exit-code.txt

  report:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ruff-output
      - name: Report Ruff output
        shell: bash
        run: |
          cat ruff-output.txt
          exit "$(cat ruff-exit-code.txt)"
