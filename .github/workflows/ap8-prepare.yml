name: Prepare AP 8

on:
  push:
    branches:
      - issue-120-ap8-retention-privacy

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-120-ap8-retention-privacy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - run: uv sync --frozen --dev
      - run: python scripts/ap8_align.py
      - run: python scripts/ap8_prepare.py
      - name: Lint and format
        run: |
          uv run ruff check --fix config/settings/base.py ki_radar/accelerator tests/test_capture_analysis_retention_privacy.py
          uv run ruff format config/settings/base.py ki_radar/accelerator tests/test_capture_analysis_retention_privacy.py
      - name: Targeted tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: uv run pytest tests/test_capture_analysis_retention_privacy.py tests/test_capture_retention.py tests/test_capture_analysis_service.py tests/test_extraction_validation.py --no-cov
      - name: Commit prepared changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .env.example config/settings/base.py ki_radar/accelerator tests/test_capture_analysis_retention_privacy.py
          git commit -m "Temporär: AP 8 Retention und Datenschutz vorbereiten"
          git push origin HEAD:issue-120-ap8-retention-privacy
