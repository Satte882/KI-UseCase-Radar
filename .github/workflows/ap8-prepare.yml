name: Prepare AP 8

on:
  push:
    branches:
      - issue-120-ap8-retention-privacy

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: ki_radar_test
          POSTGRES_USER: ki_radar
          POSTGRES_PASSWORD: ki_radar_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ki_radar -d ki_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      POSTGRES_DB: ki_radar_test
      POSTGRES_USER: ki_radar
      POSTGRES_PASSWORD: ki_radar_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://ki_radar:ki_radar_test_password@localhost:5432/ki_radar_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-120-ap8-retention-privacy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - run: uv sync --frozen --dev
      - run: python scripts/ap8_align.py
      - run: python scripts/ap8_prepare.py
      - name: Lint and format
        run: |
          uv run ruff check --fix \
            config/settings/base.py \
            ki_radar/accelerator/services.py \
            ki_radar/accelerator/retention.py \
            ki_radar/accelerator/retention_policy.py \
            ki_radar/accelerator/analysis_service.py \
            ki_radar/accelerator/extraction_validation.py \
            ki_radar/accelerator/management/commands/purge_capture_sessions.py \
            tests/test_capture_analysis_retention_privacy.py
          uv run ruff format \
            config/settings/base.py \
            ki_radar/accelerator/services.py \
            ki_radar/accelerator/retention.py \
            ki_radar/accelerator/retention_policy.py \
            ki_radar/accelerator/analysis_service.py \
            ki_radar/accelerator/extraction_validation.py \
            ki_radar/accelerator/management/commands/purge_capture_sessions.py \
            tests/test_capture_analysis_retention_privacy.py
      - name: Targeted tests
        id: targeted
        continue-on-error: true
        run: |
          set -o pipefail
          uv run pytest \
            tests/test_capture_analysis_retention_privacy.py \
            tests/test_capture_retention.py \
            tests/test_capture_analysis_service.py \
            tests/test_extraction_validation.py \
            --no-cov -vv --tb=long 2>&1 | tee ap8-test-output.txt
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ap8-test-output
          path: ap8-test-output.txt
          if-no-files-found: error
      - name: Fail after diagnostics
        if: steps.targeted.outcome == 'failure'
        run: exit 1
      - name: Commit prepared changes
        if: steps.targeted.outcome == 'success'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .env.example config/settings/base.py ki_radar/accelerator tests/test_capture_analysis_retention_privacy.py
          git commit -m "Temporär: AP 8 Retention und Datenschutz vorbereiten"
          git push origin HEAD:issue-120-ap8-retention-privacy
