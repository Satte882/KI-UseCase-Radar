name: Fix AP 10 expectation

on:
  push:
    branches:
      - issue-120-ap10-completion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-120-ap10-completion
      - name: Replace stale heading expectation
        run: >-
          sed -i
          's/("Antworten analysieren", "Geführte Use-Case-Erfassung")/("Antworten analysieren", "Assistierter Angebotsvergleich – Block-4-Abnahme")/'
          scripts/block4_ui_verification.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/block4_ui_verification.py
          git commit -m "test(ap10): align use-case review expectation"
          git push origin HEAD:issue-120-ap10-completion
