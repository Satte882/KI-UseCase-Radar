name: KI-Radar Ruff Format Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Ruff format diff
        run: uv run ruff format --diff ki_radar/use_cases/origin_consistency.py ki_radar/use_cases/templatetags/origin_consistency_tags.py tests/test_issue_351_origin_consistency.py
