name: Apply Ruff Syntax Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Correct legacy readiness indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ki_radar/delivery/readiness.py")
          content = path.read_text(encoding="utf-8")
          content = content.replace(
              '''        missing.extend(
              [
  "Ist-/Ziel-Systemlandschaft",
  "Daten- und Informationsflüsse",
  "Integrationsverträge und Verantwortlichkeiten",
              ]
          )''',
              '''        missing.extend(
              [
                  "Ist-/Ziel-Systemlandschaft",
                  "Daten- und Informationsflüsse",
                  "Integrationsverträge und Verantwortlichkeiten",
              ]
          )''',
          )
          content = content.replace(
              '''            if not _text(getattr(artifacts, field_name, "")):
  missing.append(label)''',
              '''            if not _text(getattr(artifacts, field_name, "")):
                  missing.append(label)''',
          )
          path.write_text(content, encoding="utf-8")
          PY
      - name: Format and commit
        shell: bash
        run: |
          pip install ruff==0.14.13
          ruff format ki_radar/delivery/readiness.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ki_radar/delivery/readiness.py
          git commit -m "fix(delivery): correct legacy readiness syntax"
          git push origin HEAD:${{ github.head_ref }}
