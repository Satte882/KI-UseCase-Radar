name: Diagnose Ruff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --frozen --dev
      - name: Capture Ruff output
        shell: bash
        run: uv run ruff check . --output-format=json > ruff.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: ruff.json
