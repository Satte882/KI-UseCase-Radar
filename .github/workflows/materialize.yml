name: Materialize and validate KI-Radar

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ki-radar-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: ki_radar_test
          POSTGRES_USER: ki_radar
          POSTGRES_PASSWORD: ki_radar_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ki_radar -d ki_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      POSTGRES_DB: ki_radar_test
      POSTGRES_USER: ki_radar
      POSTGRES_PASSWORD: ki_radar_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://ki_radar:ki_radar_test_password@localhost:5432/ki_radar_test

    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and extract repository
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/part-00
          test -f .bootstrap/part-04
          cat .bootstrap/part-* | base64 --decode > /tmp/ki-radar.tgz
          tar -tzf /tmp/ki-radar.tgz >/dev/null
          tar -xzf /tmp/ki-radar.tgz
          rm -rf .bootstrap
          rm -f .github/workflows/materialize.yml
          rm -f .github/workflows/bootstrap-generated-files.yml

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Generate lockfile
        run: uv lock

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Generate initial migrations
        run: uv run python manage.py makemigrations accounts core use_cases governance reviews notifications

      - name: Ruff
        run: uv run ruff check .

      - name: Django system check
        run: uv run python manage.py check

      - name: Verify migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run pytest -q

      - name: Bandit
        run: uv run bandit -q -r accounts core governance ki_radar notifications reporting reviews use_cases config

      - name: Dependency audit
        run: uv run pip-audit

      - name: Build production image
        run: docker build -t ki-radar:ci .

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Implement KI-Radar application"
          git push origin HEAD:${{ github.head_ref }}
