name: KI-Radar CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ki-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: ki_radar_test
          POSTGRES_USER: ki_radar
          POSTGRES_PASSWORD: ki_radar_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ki_radar -d ki_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      POSTGRES_DB: ki_radar_test
      POSTGRES_USER: ki_radar
      POSTGRES_PASSWORD: ki_radar_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://ki_radar:ki_radar_test_password@localhost:5432/ki_radar_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Refresh lockfile
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "Refresh dependency lockfile [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Generate initial migrations
        shell: bash
        run: |
          set -euo pipefail
          uv run python manage.py makemigrations accounts core use_cases governance reviews notifications
          git add ki_radar/**/migrations/*.py
          if ! git diff --cached --quiet; then
            git commit -m "Add initial Django migrations [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Apply safe Ruff fixes
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check . --fix || true
          uv run ruff format .
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply Ruff formatting fixes [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Ruff
        run: uv run ruff check .

      - name: Django system check
        run: uv run python manage.py check

      - name: Verify migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: uv run python manage.py migrate --noinput

      - name: Run tests
        run: uv run pytest -q

      - name: Bandit
        run: uv run bandit -q -r ki_radar config

      - name: Dependency audit
        run: uv run pip-audit

      - name: Build production image
        run: docker build -t ki-radar:ci .
