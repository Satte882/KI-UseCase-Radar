name: Temporary chronology updater

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --frozen --dev
      - name: Apply and format correction
        run: |
          python scripts/apply_outcome_chronology_fix.py
          uv run ruff format \
            ki_radar/use_cases/outcome_workspace.py \
            tests/test_delivery_to_pilot.py \
            tests/test_outcome_journey_consistency.py
          uv run ruff check \
            ki_radar/use_cases/outcome_workspace.py \
            tests/test_delivery_to_pilot.py \
            tests/test_outcome_journey_consistency.py
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ki_radar/use_cases/outcome_workspace.py \
            tests/test_delivery_to_pilot.py \
            tests/test_outcome_journey_consistency.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: bind outcome measurements to current pilot"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
