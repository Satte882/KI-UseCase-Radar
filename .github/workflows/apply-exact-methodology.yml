name: Apply Exact Methodology

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Replace embedded methodology byte-for-byte
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          encoded = """"""
          exact = gzip.decompress(base64.b64decode(encoded))
          expected = "34a6a36a18e70751542bf5023a2cc05f71710f25fb5d9557647c06163cc2062e"
          if hashlib.sha256(exact).hexdigest() != expected:
              raise SystemExit("Decoded methodology hash mismatch")

          path = Path("docs/DELIVERY_METHODOLOGY.md")
          current = path.read_bytes()
          marker = b"# Vorgehensmodell fuer produktionsreife KI-Systeme"
          utf8_marker = "# Vorgehensmodell für produktionsreife KI-Systeme".encode()
          if utf8_marker not in current:
              raise SystemExit("Methodology marker not found")
          prefix = current[: current.index(utf8_marker)]
          path.write_bytes(prefix + exact)
          PY
      - name: Commit exact document
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DELIVERY_METHODOLOGY.md
          git commit -m "docs(delivery): embed exact methodology version 2"
          git push origin HEAD:${{ github.head_ref }}
