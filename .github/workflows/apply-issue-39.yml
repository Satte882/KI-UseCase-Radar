name: Apply issue 39

on:
  push:
    branches:
      - fix/issue-39-source-provenance
    paths:
      - .github/workflows/apply-issue-39.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply product patch
        run: |
          cat .tmp/issue39.patch.gz.b64.* | base64 -d | gzip -d > /tmp/issue39.patch
          git apply --check /tmp/issue39.patch
          git apply /tmp/issue39.patch
          python -m compileall -q ki_radar tests
          rm -rf .tmp
          rm .github/workflows/apply-issue-39.yml
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Issue #39: Quellenkonsistenz und Vorbefüllungen bereinigen"
          git push
