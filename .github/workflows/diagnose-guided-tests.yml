name: Diagnose Guided Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: ki_radar
          POSTGRES_USER: ki_radar
          POSTGRES_PASSWORD: ki_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ki_radar -d ki_radar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ki_radar:ki_radar@localhost:5432/ki_radar
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: test-secret-key-for-ci-only
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
      OPENROUTER_API_KEY: ""
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --frozen --dev
      - name: Capture pytest failures
        shell: bash
        run: uv run pytest -q > guided-tests.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: guided-tests
          path: guided-tests.txt
