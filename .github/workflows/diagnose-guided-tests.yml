name: Fix Guided Regressions

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --frozen --dev
      - name: Apply focused regression fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          form = Path('templates/use_cases/form.html')
          text = form.read_text(encoding='utf-8')
          text = text.replace(
              '{{ field.label }} ist für den nächsten Schritt erforderlich.',
              '{{ field.label }} ist für die nächste Entscheidung erforderlich.',
          )
          form.write_text(text, encoding='utf-8')

          workflow = Path('ki_radar/use_cases/workflow.py')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace(
              '        if step.key == "use_case":\n            url = use_case.get_absolute_url()',
              '        if step.key == "use_case" and step.state == "complete":\n'
              '            url = use_case.get_absolute_url()',
          )
          workflow.write_text(text, encoding='utf-8')

          tests = Path('tests/test_guided_journey.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              'assert "Meine nächsten Schritte" in dashboard_response.content.decode()',
              'assert "Meine Aufgaben" in dashboard_response.content.decode()',
          )
          tests.write_text(text, encoding='utf-8')
          PY
          uv run ruff format ki_radar/use_cases/workflow.py tests/test_guided_journey.py
          uv run ruff check .
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/use_cases/form.html ki_radar/use_cases/workflow.py tests/test_guided_journey.py
          git commit -m "Fix guided workflow regressions"
          git push
