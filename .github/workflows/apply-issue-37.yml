name: Apply issue 37 patch

on:
  push:
    branches:
      - fix/issue-37-delivery-confirmation-roles

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-37-delivery-confirmation-roles
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused patch
        run: python scripts/apply_issue_37.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Issue #37: Delivery-Bestätigungen rollenbezogen absichern"
          git push origin HEAD:fix/issue-37-delivery-confirmation-roles
