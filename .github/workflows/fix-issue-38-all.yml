name: Fix issue 38 export order

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/issue-38-delivery-role-source-diff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-38-delivery-role-source-diff
          fetch-depth: 0
      - name: Sort service exports
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ki_radar/delivery/services.py')
          text = path.read_text()
          old = '''    "missing_ready_fields",\n    "render_delivery_markdown",\n    "refresh_technical_owner_source_snapshot",\n    "reset_section_reviews",\n    "resolve_technical_owner_source_change",\n    "technical_owner_source_state",\n    "review_delivery_section",\n'''
          new = '''    "missing_ready_fields",\n    "refresh_technical_owner_source_snapshot",\n    "render_delivery_markdown",\n    "reset_section_reviews",\n    "resolve_technical_owner_source_change",\n    "review_delivery_section",\n    "technical_owner_source_state",\n'''
          if old not in text:
              raise SystemExit('expected export block not found')
          path.write_text(text.replace(old, new))
          PY
          python -m compileall -q ki_radar/delivery/services.py
          rm .github/workflows/fix-issue-38-all.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sort issue #38 service exports"
          git push origin HEAD:fix/issue-38-delivery-role-source-diff
