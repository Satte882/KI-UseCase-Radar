name: Fix AP 10 scroll-container check

on:
  push:
    branches:
      - issue-120-ap10-completion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-120-ap10-completion
      - name: Ignore accessible controls inside horizontal scroll containers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/block4_ui_verification.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "          const offViewport = interactive.filter((element) => {\n"
              "            const rect = element.getBoundingClientRect();\n"
              "            const style = window.getComputedStyle(element);\n"
              "            if (style.display === 'none' || style.visibility === 'hidden') return false;\n"
              "            return rect.left < -1 || rect.right > window.innerWidth + 1;\n"
              "          });\n"
          )
          new = (
              "          const isInsideHorizontalScroller = (element) => {\n"
              "            let ancestor = element.parentElement;\n"
              "            while (ancestor && ancestor !== document.body) {\n"
              "              const ancestorStyle = window.getComputedStyle(ancestor);\n"
              "              const overflowX = ancestorStyle.overflowX;\n"
              "              if (\n"
              "                (overflowX === 'auto' || overflowX === 'scroll') &&\n"
              "                ancestor.scrollWidth > ancestor.clientWidth + 1\n"
              "              ) {\n"
              "                return true;\n"
              "              }\n"
              "              ancestor = ancestor.parentElement;\n"
              "            }\n"
              "            return false;\n"
              "          };\n"
              "          const offViewport = interactive.filter((element) => {\n"
              "            const rect = element.getBoundingClientRect();\n"
              "            const style = window.getComputedStyle(element);\n"
              "            if (style.display === 'none' || style.visibility === 'hidden') return false;\n"
              "            const outsideViewport = rect.left < -1 || rect.right > window.innerWidth + 1;\n"
              "            return outsideViewport && !isInsideHorizontalScroller(element);\n"
              "          });\n"
          )
          if old not in text:
              raise SystemExit("viewport filter anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit corrected check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/block4_ui_verification.py
          git commit -m "test(ap10): allow controls in horizontal scroll containers"
          git push origin HEAD:issue-120-ap10-completion
