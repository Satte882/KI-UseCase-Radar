name: PR Migration Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: diagnostic-only-secret
      DATABASE_URL: sqlite:////tmp/diagnostic.sqlite3
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --frozen --dev --quiet
      - name: Capture migration output
        shell: bash
        run: |
          set +e
          uv run python manage.py makemigrations use_cases --dry-run --verbosity 3 > migration-output.txt 2>&1
          printf '0\n' > migration-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: migration-output
          path: |
            migration-output.txt
            migration-exit-code.txt

  report:
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: migration-output
      - name: Report migration output
        shell: bash
        run: |
          cat migration-output.txt
          exit "$(cat migration-exit-code.txt)"
