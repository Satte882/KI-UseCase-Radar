name: Ruff format probe
on:
  pull_request:
    paths:
      - "ki_radar/architecture/management/commands/correct_real_demo_scope.py"
      - ".github/workflows/format-probe.yml"
permissions:
  contents: read
jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --frozen --dev
      - name: Print Ruff format diff
        run: |
          uv run ruff format ki_radar/architecture/management/commands/correct_real_demo_scope.py
          git diff -- ki_radar/architecture/management/commands/correct_real_demo_scope.py
