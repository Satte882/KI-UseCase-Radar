name: Fix Guided Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --frozen --dev
      - name: Split long text constants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          actions = Path('ki_radar/delivery/actions.py')
          text = actions.read_text(encoding='utf-8')
          text = text.replace(
              '"Der zugeordnete Technical Owner ist nicht aktiv und kann die technische Verantwortung nicht wahrnehmen.",',
              '("Der zugeordnete Technical Owner ist nicht aktiv und kann die "\n'
              ' "technische Verantwortung nicht wahrnehmen."),',
          )
          text = text.replace(
              '"Business- und technische Verantwortung liegen bei derselben Person. Für dieses kritische Vorhaben wird eine unabhängige Zweitprüfung empfohlen.",',
              '("Business- und technische Verantwortung liegen bei derselben Person. "\n'
              ' "Für dieses kritische Vorhaben wird eine unabhängige Zweitprüfung empfohlen."),',
          )
          actions.write_text(text, encoding='utf-8')

          workflow = Path('ki_radar/use_cases/workflow.py')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace('details=tuple(action.message for action in []),', 'details=(),')
          text = text.replace(
              '"Alle Pflichtinhalte und Bestätigungen liegen vor. Das Package kann als bereit markiert werden."',
              '("Alle Pflichtinhalte und Bestätigungen liegen vor. "\n'
              ' "Das Package kann als bereit markiert werden.")',
          )
          text = text.replace(
              '"Alle Pflichtinhalte und Bestätigungen liegen vor; ein KI-Koordinator kann das Package als bereit markieren."',
              '("Alle Pflichtinhalte und Bestätigungen liegen vor; "\n'
              ' "ein KI-Koordinator kann das Package als bereit markieren.")',
          )
          workflow.write_text(text, encoding='utf-8')
          PY
          uv run ruff format ki_radar/delivery/actions.py ki_radar/use_cases/workflow.py
          uv run ruff check .
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ki_radar/delivery/actions.py ki_radar/use_cases/workflow.py
          git commit -m "Fix remaining guided workflow lint"
          git push
