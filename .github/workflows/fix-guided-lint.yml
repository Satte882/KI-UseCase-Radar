name: Diagnose Guided Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --frozen --dev
      - name: Capture remaining lint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ki_radar/use_cases/workflow.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('details=tuple(action.message for action in []),', 'details=(),')
          path.write_text(text, encoding='utf-8')
          PY
          uv run ruff check . > guided-lint.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: guided-lint
          path: guided-lint.txt
