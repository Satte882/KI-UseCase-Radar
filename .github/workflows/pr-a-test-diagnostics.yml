name: PR A Test Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-diagnostics:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: ki_radar_test
          POSTGRES_USER: ki_radar
          POSTGRES_PASSWORD: ki_radar_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ki_radar -d ki_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      POSTGRES_DB: ki_radar_test
      POSTGRES_USER: ki_radar
      POSTGRES_PASSWORD: ki_radar_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://ki_radar:ki_radar_test_password@localhost:5432/ki_radar_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Collect test output
        shell: bash
        run: |
          set +e
          uv run pytest -q --tb=short > test-diagnostics.txt 2>&1
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr-a-test-diagnostics
          path: test-diagnostics.txt
