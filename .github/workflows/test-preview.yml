name: Test Preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-preview:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: ki_radar
          POSTGRES_USER: ki_radar
          POSTGRES_PASSWORD: ki_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ki_radar -d ki_radar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ki_radar:ki_radar@127.0.0.1:5432/ki_radar
      DJANGO_SECRET_KEY: preview-only-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --dev
      - name: Capture test output
        run: |
          set +e
          uv run pytest -q > pytest-output.txt 2>&1
          echo $? > pytest-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: |
            pytest-output.txt
            pytest-exit-code.txt
          if-no-files-found: error
