name: Format issue 39

on:
  push:
    branches:
      - fix/issue-39-source-provenance
    paths:
      - .github/workflows/format-issue-39.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Apply Ruff formatting
        run: |
          uv sync --frozen --dev
          uv run ruff format \
            ki_radar/architecture/provenance.py \
            ki_radar/delivery/readiness.py \
            ki_radar/delivery/services.py \
            tests/test_architecture_discovery.py \
            tests/test_delivery_readiness_v2.py
          uv run ruff check .
          uv run ruff format --check .
          rm .github/workflows/format-issue-39.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format issue #39 implementation"
          git push
