name: Mobile Overflow Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: ki_radar_test
          POSTGRES_USER: ki_radar
          POSTGRES_PASSWORD: ki_radar_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ki_radar -d ki_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: mobile-overflow-diagnostic
      POSTGRES_DB: ki_radar_test
      POSTGRES_USER: ki_radar
      POSTGRES_PASSWORD: ki_radar_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://ki_radar:ki_radar_test_password@localhost:5432/ki_radar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Prepare application
        run: |
          uv sync --frozen --dev
          uv pip install playwright==1.55.0
          uv run playwright install chromium --with-deps
          uv run python manage.py migrate --noinput
          uv run python manage.py shell <<'PY'
          import json
          from django.conf import settings
          from django.core.management import call_command
          from ki_radar.accounts.models import User
          from ki_radar.core.demo_architecture_data import INVOICE_USE_CASE_KEY
          from ki_radar.delivery.services import current_delivery_package, hand_over_package
          from ki_radar.use_cases.models import UseCase
          settings.DEBUG = True
          call_command("seed_demo_data", demo_user_password="Delivery-Pilot-Demo-2026!")
          coordinator = User.objects.get(username="demo_ki_koordinator")
          use_case = UseCase.objects.get(demo_key=INVOICE_USE_CASE_KEY)
          hand_over_package(current_delivery_package(use_case), coordinator)
          with open("target.json", "w", encoding="utf-8") as handle:
              json.dump({"detail": use_case.get_absolute_url()}, handle)
          PY
      - name: Start application
        run: |
          uv run python manage.py runserver 127.0.0.1:8000 --insecure > server.log 2>&1 &
          echo $! > server.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/accounts/login/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Diagnose mobile elements
        run: |
          mkdir -p diagnostic
          uv run python - <<'PY' | tee diagnostic/mobile-overflow.txt
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          base = "http://127.0.0.1:8000"
          detail = json.loads(Path("target.json").read_text())["detail"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 390, "height": 844})
              page.goto(base + "/accounts/login/", wait_until="networkidle")
              page.locator('input[name="username"]').fill("demo_ki_koordinator")
              password = page.locator('input[name="password"]')
              password.fill("Delivery-Pilot-Demo-2026!")
              password.press("Enter")
              page.wait_for_load_state("networkidle")
              page.goto(base + detail, wait_until="networkidle")
              result = page.evaluate("""
              () => {
                const width = window.innerWidth;
                const nodes = [...document.querySelectorAll('*')].map((el) => {
                  const r = el.getBoundingClientRect();
                  return {
                    tag: el.tagName,
                    id: el.id,
                    cls: typeof el.className === 'string' ? el.className : '',
                    left: Math.round(r.left * 100) / 100,
                    right: Math.round(r.right * 100) / 100,
                    width: Math.round(r.width * 100) / 100,
                    scrollWidth: el.scrollWidth,
                    clientWidth: el.clientWidth,
                  };
                }).filter((x) => x.right > width + 0.5 || x.left < -0.5);
                return {
                  innerWidth: width,
                  htmlScrollWidth: document.documentElement.scrollWidth,
                  bodyScrollWidth: document.body.scrollWidth,
                  offenders: nodes.slice(0, 80),
                };
              }
              """)
              print(json.dumps(result, indent=2, ensure_ascii=False))
              page.screenshot(path="diagnostic/mobile-detail.png", full_page=True)
              browser.close()
          PY
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: mobile-overflow-diagnostic
          path: diagnostic/
      - name: Stop application
        if: always()
        run: kill "$(cat server.pid)" || true
