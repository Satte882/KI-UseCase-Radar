name: Fix issue 39 lint

on:
  push:
    branches:
      - fix/issue-39-source-provenance
    paths:
      - .github/workflows/fix-issue-39-lint.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix lint findings
        run: |
          python - <<'PY'
          from pathlib import Path

          readiness = Path("ki_radar/delivery/readiness.py")
          content = readiness.read_text()
          content = content.replace("snapshot_text or '–'", "snapshot_text or '-'")
          content = content.replace("current_text or '–'", "current_text or '-'")
          readiness.write_text(content)

          services = Path("ki_radar/delivery/services.py")
          content = services.read_text()
          old = '''__all__ = [
              "APPROVED_STATUSES",
              "build_initial_delivery_data",
              "delivery_source_differences",
              "create_delivery_package",
              "current_delivery_package",
              "current_handed_over_package",
              "delivery_eligibility",
              "hand_over_package",
              "latest_final_approval",
              "mark_package_ready",
              "missing_ready_fields",
              "render_delivery_markdown",
              "reset_section_reviews",
              "review_delivery_section",
          ]'''
          new = '''__all__ = [
              "APPROVED_STATUSES",
              "build_initial_delivery_data",
              "create_delivery_package",
              "current_delivery_package",
              "current_handed_over_package",
              "delivery_eligibility",
              "delivery_source_differences",
              "hand_over_package",
              "latest_final_approval",
              "mark_package_ready",
              "missing_ready_fields",
              "render_delivery_markdown",
              "reset_section_reviews",
              "review_delivery_section",
          ]'''
          if old not in content:
              raise SystemExit("Expected __all__ block not found")
          services.write_text(content.replace(old, new, 1))
          PY
          python -m compileall -q ki_radar tests
          rm .github/workflows/fix-issue-39-lint.yml
      - name: Commit lint correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix issue #39 lint findings"
          git push
