name: PR A Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Collect diagnostics
        shell: bash
        run: |
          set +e
          uv run ruff check . --output-format concise > diagnostics.txt 2>&1
          printf '\n--- FORMAT ---\n' >> diagnostics.txt
          uv run ruff format --check . >> diagnostics.txt 2>&1
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr-a-diagnostics
          path: diagnostics.txt
