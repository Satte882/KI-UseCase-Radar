name: Temporary duplicate helper cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --frozen --dev
      - name: Remove duplicate helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ki_radar/use_cases/outcome_workspace.py")
          text = path.read_text(encoding="utf-8")
          helper = '''def _measurement_fields_complete(use_case: UseCase) -> bool:
              return not _measurement_missing(use_case)


          '''
          duplicate = helper + helper
          if duplicate not in text:
              raise SystemExit(0)
          path.write_text(text.replace(duplicate, helper, 1), encoding="utf-8")
          PY
          uv run ruff format ki_radar/use_cases/outcome_workspace.py
          uv run ruff check ki_radar/use_cases/outcome_workspace.py
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- ki_radar/use_cases/outcome_workspace.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ki_radar/use_cases/outcome_workspace.py
          git commit -m "fix: remove duplicate measurement helper"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
