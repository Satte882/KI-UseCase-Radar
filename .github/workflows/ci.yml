name: KI-Radar CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ki-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: ki_radar_test
          POSTGRES_USER: ki_radar
          POSTGRES_PASSWORD: ki_radar_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ki_radar -d ki_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      POSTGRES_DB: ki_radar_test
      POSTGRES_USER: ki_radar
      POSTGRES_PASSWORD: ki_radar_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://ki_radar:ki_radar_test_password@localhost:5432/ki_radar_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/issue-48-value-stream-assignments
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Apply issue 48 patch
        run: |
          python scripts/apply_issue48.py
          python scripts/fix_issue48_lint.py
      - name: Format and lint implementation
        run: |
          uv run ruff format ki_radar/architecture/forms.py tests/test_value_stream_assignments.py
          uv run ruff check ki_radar/architecture/forms.py tests/test_value_stream_assignments.py
      - name: Verify focused behavior
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py migrate --noinput
          uv run pytest -q tests/test_value_stream_assignments.py
      - name: Commit validated implementation and restore CI
        run: |
          rm scripts/apply_issue48.py scripts/fix_issue48_lint.py
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Issue #48: Value-Stream-Zuordnungen plausibilisieren"
          git push origin HEAD:fix/issue-48-value-stream-assignments
