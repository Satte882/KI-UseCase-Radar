name: KI-Radar CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ki-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: ki_radar_test
          POSTGRES_USER: ki_radar
          POSTGRES_PASSWORD: ki_radar_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ki_radar -d ki_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      POSTGRES_DB: ki_radar_test
      POSTGRES_USER: ki_radar
      POSTGRES_PASSWORD: ki_radar_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://ki_radar:ki_radar_test_password@localhost:5432/ki_radar_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Apply migrations
        run: uv run python manage.py migrate --noinput

      - name: Prepare handed-over demo
        run: |
          uv run python manage.py shell <<'PY'
          import json
          from django.conf import settings
          from django.core.management import call_command
          from ki_radar.accounts.models import User
          from ki_radar.core.demo_architecture_data import INVOICE_USE_CASE_KEY
          from ki_radar.delivery.services import current_delivery_package, hand_over_package
          from ki_radar.use_cases.models import UseCase
          from ki_radar.use_cases.workflow import pilot_start_url

          settings.DEBUG = True
          call_command("seed_demo_data", demo_user_password="Delivery-Pilot-Demo-2026!")
          coordinator = User.objects.get(username="demo_ki_koordinator")
          use_case = UseCase.objects.get(demo_key=INVOICE_USE_CASE_KEY)
          package = current_delivery_package(use_case)
          hand_over_package(package, coordinator)
          with open("browser-targets.json", "w", encoding="utf-8") as target_file:
              json.dump(
                  {
                      "detail": use_case.get_absolute_url(),
                      "pilot_start": pilot_start_url(use_case),
                  },
                  target_file,
              )
          PY

      - name: Install Chromium
        run: |
          uv pip install playwright==1.55.0
          uv run playwright install chromium --with-deps

      - name: Start server
        run: |
          uv run python manage.py runserver 127.0.0.1:8000 --insecure > browser-server.log 2>&1 &
          echo $! > browser-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/accounts/login/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat browser-server.log
          exit 1

      - name: Verify Desktop and Mobile flow
        run: |
          mkdir -p browser-evidence
          uv run python - <<'PY' 2>&1 | tee browser-evidence/playwright-output.txt
          import json
          from pathlib import Path

          from playwright.sync_api import expect, sync_playwright

          base_url = "http://127.0.0.1:8000"
          targets = json.loads(Path("browser-targets.json").read_text(encoding="utf-8"))
          viewports = {
              "desktop": {"width": 1440, "height": 900},
              "mobile": {"width": 390, "height": 844},
          }

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              for name, viewport in viewports.items():
                  context = browser.new_context(viewport=viewport)
                  page = context.new_page()
                  page.goto(base_url + "/accounts/login/", wait_until="networkidle")
                  page.locator('input[name="username"]').fill("demo_ki_koordinator")
                  password = page.locator('input[name="password"]')
                  password.fill("Delivery-Pilot-Demo-2026!")
                  password.press("Enter")
                  page.wait_for_load_state("networkidle")
                  expect(page.locator('input[name="password"]')).to_have_count(0)

                  page.goto(base_url + targets["detail"], wait_until="networkidle")
                  pilot_link = page.get_by_role("link", name="Pilot starten").first
                  expect(pilot_link).to_be_visible()
                  if page.evaluate("document.documentElement.scrollWidth > window.innerWidth"):
                      raise AssertionError(f"Horizontal overflow on {name} detail page")
                  page.screenshot(path=f"browser-evidence/{name}-detail.png", full_page=True)
                  pilot_link.click()
                  page.wait_for_load_state("networkidle")

                  expect(page.locator('input[name="pilot_start"]')).to_be_visible()
                  expect(page.get_by_role("button", name="Pilot starten")).to_be_visible()
                  if page.evaluate("document.documentElement.scrollWidth > window.innerWidth"):
                      raise AssertionError(f"Horizontal overflow on {name} Pilot form")
                  page.screenshot(path=f"browser-evidence/{name}-pilot-form.png", full_page=True)
                  context.close()
              browser.close()
          PY

      - name: Capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-to-pilot-browser-evidence
          path: |
            browser-evidence/
            browser-server.log

      - name: Stop server
        if: always()
        run: |
          if [ -f browser-server.pid ]; then
            kill "$(cat browser-server.pid)" || true
          fi
