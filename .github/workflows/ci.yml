name: KI-Radar CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ki-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: ki_radar_test
          POSTGRES_USER: ki_radar
          POSTGRES_PASSWORD: ki_radar_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ki_radar -d ki_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      POSTGRES_DB: ki_radar_test
      POSTGRES_USER: ki_radar
      POSTGRES_PASSWORD: ki_radar_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://ki_radar:ki_radar_test_password@localhost:5432/ki_radar_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/issue-44-guided-second-approval
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Apply issue 44 patch
        run: |
          python scripts/apply_issue44.py
          python - <<'PY'
          from pathlib import Path

          path = Path("ki_radar/use_cases/decision_views.py")
          text = path.read_text(encoding="utf-8")
          old = '''                        messages.info(
                            request,
                            "Die Freigabe mit Auflagen wurde zur unabhängigen Zweitprüfung "
                            f"an {decision.second_approval_assignee.get_display_name()} zugewiesen.",
                        )'''
          new = '''                        assignee_name = (
                            decision.second_approval_assignee.get_display_name()
                        )
                        messages.info(
                            request,
                            "Die Freigabe mit Auflagen wurde zur unabhängigen Zweitprüfung "
                            f"an {assignee_name} zugewiesen.",
                        )'''
          if old not in text:
              raise RuntimeError("Expected decision message not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("tests/test_guided_second_approval.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from django.contrib.auth.models import Group\n",
              "from django.contrib.auth.models import Group\n"
              "from django.core.exceptions import PermissionDenied\n",
              1,
          )
          text = text.replace(
              "from ki_radar.use_cases.models import ApprovalDecision, DecisionAssessment, UseCase\n",
              "from ki_radar.use_cases.models import DecisionAssessment, UseCase\n",
              1,
          )
          text = text.replace(
              "with pytest.raises(Exception):",
              "with pytest.raises(PermissionDenied):",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format and lint patch
        run: |
          uv run ruff format ki_radar/use_cases/models.py ki_radar/use_cases/services.py ki_radar/use_cases/decision_forms.py ki_radar/use_cases/decision_views.py ki_radar/use_cases/urls.py ki_radar/core/demo_data.py tests/test_guided_second_approval.py ki_radar/use_cases/migrations/0003_guided_second_approval.py
          uv run ruff check ki_radar/use_cases/models.py ki_radar/use_cases/services.py ki_radar/use_cases/decision_forms.py ki_radar/use_cases/decision_views.py ki_radar/use_cases/urls.py ki_radar/core/demo_data.py tests/test_guided_second_approval.py ki_radar/use_cases/migrations/0003_guided_second_approval.py

      - name: Verify migration and targeted tests
        run: |
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py migrate --noinput
          uv run pytest -q tests/test_guided_second_approval.py

      - name: Commit validated implementation and restore CI
        run: |
          rm scripts/apply_issue44.py
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Issue #44: Unabhängige Zweitprüfung gezielt führen"
          git push origin HEAD:fix/issue-44-guided-second-approval
