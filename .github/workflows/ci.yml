name: KI-Radar CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ki-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Apply exact Ruff formatting
        run: uv run ruff format ki_radar/architecture/forms.py ki_radar/architecture/stage_focus_forms.py

      - name: Restore production CI workflow
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ki_radar/architecture/forms.py ki_radar/architecture/stage_focus_forms.py .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(#331): apply Ruff formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
