name: Apply outcome chronology fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ki-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Apply chronology correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ki_radar/use_cases/outcome_workspace.py")
          text = path.read_text(encoding="utf-8")

          old = '''def _measurement_complete(use_case: UseCase) -> bool:
              return not _measurement_missing(use_case)
          '''
          new = '''def _measurement_fields_complete(use_case: UseCase) -> bool:
              return not _measurement_missing(use_case)


          def _measurement_complete(use_case: UseCase) -> bool:
              if not _measurement_fields_complete(use_case) or use_case.pilot_start is None:
                  return False
              return use_case.metric_measured_at >= use_case.pilot_start


          def _measurement_predates_pilot(use_case: UseCase) -> bool:
              return bool(
                  _measurement_fields_complete(use_case)
                  and use_case.pilot_start is not None
                  and use_case.metric_measured_at < use_case.pilot_start
              )
          '''
          if old not in text:
              raise SystemExit("measurement helper pattern not found")
          text = text.replace(old, new, 1)

          old = '''                reason=(
                          "Dateninkonsistenz: Ein Pilotstart ist dokumentiert, der "
                          "Lifecycle-Status steht jedoch nicht auf Pilot, Betrieb oder Beendet."
                      ),
          '''
          new = '''                reason=(
                          "Dateninkonsistenz: Ein Pilotstart ist dokumentiert, aber der "
                          "Lifecycle-Status oder die Nachweise belegen keinen laufenden oder "
                          "abgeschlossenen Pilot."
                      ),
          '''
          if old not in text:
              raise SystemExit("pilot reason pattern not found")
          text = text.replace(old, new, 1)

          old = '''            details=missing if has_data else (),
              )
              if measurement_complete:
          '''
          new = '''            details=missing if has_data else (),
              )
              if _measurement_predates_pilot(use_case):
                  return JourneyStep(
                      key="measurement",
                      label="Wirkungsmessung",
                      state="upcoming",
                      url=f"{edit_url}?highlight=metric_measured_at",
                      action_label="Messung für aktuellen Pilot aktualisieren",
                      reason=(
                          "Die vorhandene Messung stammt aus der Zeit vor dem aktuellen "
                          "Pilotbeginn und schließt diesen Pilot nicht ab."
                      ),
                      details=("Messdatum nach Pilotbeginn",),
                  )
              if measurement_complete:
          '''
          if old not in text:
              raise SystemExit("measurement step pattern not found")
          text = text.replace(old, new, 1)

          old = '''        or pilot_started
                  or _has_measurement_data(use_case)
                  or go_live_recorded
          '''
          new = '''        or pilot_started
                  or go_live_recorded
          '''
          if old not in text:
              raise SystemExit("lifecycle advanced pattern not found")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          uv run ruff format ki_radar/use_cases/outcome_workspace.py
          uv run ruff check ki_radar/use_cases/outcome_workspace.py

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ki_radar/use_cases/outcome_workspace.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: bind measurements to current pilot"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
