name: KI-Radar CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ki-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: ki_radar_test
          POSTGRES_USER: ki_radar
          POSTGRES_PASSWORD: ki_radar_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ki_radar -d ki_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      POSTGRES_DB: ki_radar_test
      POSTGRES_USER: ki_radar
      POSTGRES_PASSWORD: ki_radar_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://ki_radar:ki_radar_test_password@localhost:5432/ki_radar_test

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-58-final-journey-order

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Persist failing test names
        shell: bash
        run: |
          set +e
          uv run pytest -q --junitxml=/tmp/issue-58-junit.xml > /dev/null 2>&1
          status=$?
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = ET.parse('/tmp/issue-58-junit.xml').getroot()
          failures = []
          for case in root.iter('testcase'):
              failure = case.find('failure')
              error = case.find('error')
              result = failure if failure is not None else error
              if result is not None:
                  failures.append(
                      f"{case.get('classname')}::{case.get('name')}\n{(result.get('message') or '').strip()}"
                  )
          path = Path('.ci-diagnostics/issue-58-failures.txt')
          path.parent.mkdir(exist_ok=True)
          path.write_text('\n\n'.join(failures) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-diagnostics/issue-58-failures.txt
          git commit -m "Record issue 58 test failures [skip ci]"
          git push origin HEAD:fix/issue-58-final-journey-order
          exit "$status"
