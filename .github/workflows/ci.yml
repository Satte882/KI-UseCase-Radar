name: KI-Radar CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ki-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Apply deterministic fixes
        shell: python
        run: |
          from pathlib import Path

          service = Path("ki_radar/architecture/solution_selection.py")
          text = service.read_text()
          needle = '        .select_related("stage__value_stream__focus")\n'
          if needle not in text:
              raise SystemExit("expected select_related call not found")
          service.write_text(text.replace(needle, ""))

          template = Path("templates/architecture/process_analysis_detail.html")
          text = template.read_text()
          old_action = "journey.next_action_label == 'Lösungsoptionen vergleichen'"
          if old_action not in text:
              raise SystemExit("expected journey attribute not found")
          text = text.replace(
              old_action,
              "journey.next_action.action_label == 'Lösungsoptionen vergleichen'",
          )
          text = text.replace("state-blocked%{% else", "state-blocked{% else")
          template.write_text(text)

      - name: Format Python fix
        run: uv run ruff format ki_radar/architecture/solution_selection.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ki_radar/architecture/solution_selection.py templates/architecture/process_analysis_detail.html
          git diff --cached --quiet || git commit -m "Issue #47: PostgreSQL-Lock und Journey-Anzeige korrigieren"
          git push origin HEAD:${{ github.head_ref }}
