name: KI-Radar CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ki-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-expectations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-58-final-journey-order
          fetch-depth: 0

      - name: Update journey expectations and restore workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          delivery_path = Path('tests/test_delivery_to_pilot.py')
          delivery = delivery_path.read_text(encoding='utf-8')
          old_delivery_order = '''    assert [step.key for step in before.steps[:8]] == [
              "value_stream",
              "focus",
              "process",
              "solution",
              "use_case",
              "assessment",
              "approval",
              "delivery",
          ]'''
          new_delivery_order = '''    assert [step.key for step in before.steps[:9]] == [
              "value_stream",
              "focus",
              "process",
              "solution",
              "use_case",
              "assessment",
              "governance",
              "approval",
              "delivery",
          ]'''
          old_delivery_complete = '''            "use_case",
                      "assessment",
                      "approval",
                  ]'''
          new_delivery_complete = '''            "use_case",
                      "assessment",
                      "governance",
                      "approval",
                  ]'''
          if old_delivery_order not in delivery or old_delivery_complete not in delivery:
              raise SystemExit('Expected delivery journey snippets not found')
          delivery = delivery.replace(old_delivery_order, new_delivery_order, 1)
          delivery = delivery.replace(old_delivery_complete, new_delivery_complete, 1)
          delivery_path.write_text(delivery, encoding='utf-8')

          guided_path = Path('tests/test_guided_journey.py')
          guided = guided_path.read_text(encoding='utf-8')
          old_guided_order = '''        "use_case",
                  "assessment",
                  "approval",
                  "delivery",
              ]'''
          new_guided_order = '''        "use_case",
                  "assessment",
                  "governance",
                  "approval",
                  "delivery",
              ]'''
          old_guided_complete = '''            "use_case",
                      "assessment",
                      "approval",
                  ]'''
          new_guided_complete = '''            "use_case",
                      "assessment",
                      "governance",
                      "approval",
                  ]'''
          if old_guided_order not in guided or old_guided_complete not in guided:
              raise SystemExit('Expected guided journey snippets not found')
          guided = guided.replace(old_guided_order, new_guided_order, 1)
          guided = guided.replace(old_guided_complete, new_guided_complete, 1)
          guided_path.write_text(guided, encoding='utf-8')
          PY
          rm -rf .ci-diagnostics
          git checkout origin/main -- .github/workflows/ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_delivery_to_pilot.py tests/test_guided_journey.py .github/workflows/ci.yml
          git add -A .ci-diagnostics
          git commit -m "Update golden-path expectations for governance journey"
          git push origin HEAD:fix/issue-58-final-journey-order
