name: KI-Radar CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ki-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: ki_radar_test
          POSTGRES_USER: ki_radar
          POSTGRES_PASSWORD: ki_radar_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ki_radar -d ki_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      POSTGRES_DB: ki_radar_test
      POSTGRES_USER: ki_radar
      POSTGRES_PASSWORD: ki_radar_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://ki_radar:ki_radar_test_password@localhost:5432/ki_radar_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/issue-44-guided-second-approval
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Apply issue 44 patch
        run: |
          python scripts/apply_issue44.py
          python scripts/fix_issue44_generated.py

      - name: Format and lint patch
        run: |
          uv run ruff format ki_radar/use_cases/models.py ki_radar/use_cases/services.py ki_radar/use_cases/decision_forms.py ki_radar/use_cases/decision_views.py ki_radar/use_cases/urls.py ki_radar/core/demo_data.py tests/test_guided_second_approval.py ki_radar/use_cases/migrations/0006_guided_second_approval.py
          uv run ruff check ki_radar/use_cases/models.py ki_radar/use_cases/services.py ki_radar/use_cases/decision_forms.py ki_radar/use_cases/decision_views.py ki_radar/use_cases/urls.py ki_radar/core/demo_data.py tests/test_guided_second_approval.py ki_radar/use_cases/migrations/0006_guided_second_approval.py

      - name: Verify migration and targeted tests
        run: |
          uv run python manage.py makemigrations --check --dry-run
          uv run python manage.py migrate --noinput
          uv run pytest -q tests/test_guided_second_approval.py

      - name: Commit validated implementation and restore CI
        run: |
          rm scripts/apply_issue44.py scripts/fix_issue44_generated.py
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Issue #44: Unabhängige Zweitprüfung gezielt führen"
          git push origin HEAD:fix/issue-44-guided-second-approval
