name: KI-Radar CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ki-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/issue-37-delivery-confirmation-roles
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Apply integration fixes, format and restore CI
        run: |
          python scripts/apply_issue37_integration_fixes.py
          rm scripts/apply_issue37_integration_fixes.py
          uv run ruff format ki_radar/delivery/permissions.py tests/test_delivery_handover.py tests/test_delivery_to_pilot.py tests/test_guided_workflow_ux.py
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align delivery integration tests with role confirmations"
          git push origin HEAD:fix/issue-37-delivery-confirmation-roles
