name: Apply golden path chronology assertion

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ki-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Update golden path assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_delivery_to_pilot.py")
          text = path.read_text(encoding="utf-8")
          old = '''    outcome = build_outcome_workspace_journey(use_case, coordinator)
              outcome_steps = {step.key: step for step in outcome.steps}
              assert outcome_steps["pilot"].state == "complete"
              assert outcome_steps["measurement"].state == "complete"
              assert outcome_steps["outcome_decision"].state == "current"
          '''
          new = '''    outcome = build_outcome_workspace_journey(use_case, coordinator)
              outcome_steps = {step.key: step for step in outcome.steps}
              assert outcome_steps["pilot"].state == "current"
              assert outcome_steps["measurement"].state == "upcoming"
              assert outcome_steps["outcome_decision"].state == "upcoming"
              assert sum(step.state == "current" for step in outcome_steps.values()) == 1
          '''
          if old not in text:
              raise SystemExit("golden path assertion block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_delivery_to_pilot.py
          git commit -m "test: keep fresh pilot current with stale measurement"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
