name: KI-Radar CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ki-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply deterministic fixes
        shell: python
        run: |
          from pathlib import Path

          service = Path("ki_radar/architecture/solution_selection.py")
          text = service.read_text()
          old = '''    process_analysis = (
              ProcessAnalysis.objects.select_for_update()
              .select_related("stage__value_stream__focus")
              .get(pk=process_analysis.pk)
          )
          '''
          new = '''    process_analysis = ProcessAnalysis.objects.select_for_update().get(
              pk=process_analysis.pk
          )
          '''
          if old not in text:
              raise SystemExit("expected lock block not found")
          service.write_text(text.replace(old, new))

          template = Path("templates/architecture/process_analysis_detail.html")
          text = template.read_text()
          text = text.replace(
              "journey.next_action_label == 'Lösungsoptionen vergleichen'",
              "journey.next_action.action_label == 'Lösungsoptionen vergleichen'",
          )
          text = text.replace("state-blocked%{% else", "state-blocked{% else")
          template.write_text(text)

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ki_radar/architecture/solution_selection.py templates/architecture/process_analysis_detail.html
          git diff --cached --quiet || git commit -m "Issue #47: PostgreSQL-Lock und Journey-Anzeige korrigieren"
          git push origin HEAD:${{ github.head_ref }}
