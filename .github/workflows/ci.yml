name: KI-Radar CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ki-radar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Apply Ruff formatting
        run: >-
          uv run ruff format
          ki_radar/architecture/forms.py
          ki_radar/architecture/models.py
          tests/test_process_analysis.py
          tests/test_solution_option_comparison.py

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ki_radar/architecture/forms.py ki_radar/architecture/models.py tests/test_process_analysis.py tests/test_solution_option_comparison.py
          git diff --cached --quiet || git commit -m "Issue #47: Ruff-Formatierung anwenden"
          git push origin HEAD:${{ github.head_ref }}
