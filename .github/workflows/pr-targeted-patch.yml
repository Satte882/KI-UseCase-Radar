name: PR Targeted Patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feature/guided-journey-demo-scenarios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          show-progress: false
      - name: Preserve customer-service lifecycle state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ki_radar/core/demo_architecture_data.py")
          text = path.read_text(encoding="utf-8")
          status_line = "    customer.status = UseCase.Status.PILOT\n"
          update_fields = '["status", "decision_status", "updated_at"]'
          replacement_fields = '["decision_status", "updated_at"]'
          if status_line not in text or update_fields not in text:
              raise SystemExit("Expected customer-service status block not found")
          text = text.replace(status_line, "", 1)
          text = text.replace(update_fields, replacement_fields, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ki_radar/core/demo_architecture_data.py
          git commit -m "Preserve customer service operation state"
          git push origin HEAD:${{ github.head_ref }}
