name: Delete merged branches

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: delete-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged same-repository branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["GH_REPOSITORY"]
          default_branch = os.environ["DEFAULT_BRANCH"]
          api_root = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "ki-radar-merged-branch-cleanup",
          }


          def api_request(url: str, *, method: str = "GET"):
              request = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status == 204:
                      return None
                  return json.loads(response.read().decode("utf-8"))


          def pull_requests(state: str):
              page = 1
              while True:
                  url = f"{api_root}/pulls?state={state}&per_page=100&page={page}"
                  batch = api_request(url)
                  if not batch:
                      return
                  yield from batch
                  if len(batch) < 100:
                      return
                  page += 1


          open_branches = {
              pull["head"]["ref"]
              for pull in pull_requests("open")
              if pull.get("head", {}).get("repo", {}).get("full_name") == repository
          }
          merged_branches = {
              pull["head"]["ref"]
              for pull in pull_requests("closed")
              if pull.get("merged_at")
              and pull.get("head", {}).get("repo", {}).get("full_name") == repository
              and pull["head"]["ref"] != default_branch
              and pull["head"]["ref"] not in open_branches
          }

          for branch in sorted(merged_branches):
              encoded = urllib.parse.quote(branch, safe="/")
              url = f"{api_root}/git/refs/heads/{encoded}"
              try:
                  api_request(url, method="DELETE")
              except urllib.error.HTTPError as exc:
                  if exc.code in {404, 422}:
                      print(f"Branch bereits entfernt oder geschützt: {branch}")
                      continue
                  raise
              print(f"Gemergten Branch gelöscht: {branch}")
          PY
