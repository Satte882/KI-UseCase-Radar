name: Finalize issue 39 regression

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/issue-39-finalize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-39-finalize
          fetch-depth: 0
      - name: Align obsolete regression expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_delivery_handover.py')
          text = path.read_text()
          old = '    assert "Value Stream: Beschaffung bis Zahlung" in package.in_scope\n'
          new = '''    assert package.in_scope == stream.scope_in
    scope_manifest = package.section_reviews.get(
        section_key="scope_and_users"
    ).source_manifest
    assert scope_manifest["fields"]["in_scope"]["artifact_label"] == "Value Stream"
    assert scope_manifest["fields"]["in_scope"]["source_value"] == stream.scope_in
'''
          if old not in text:
              raise SystemExit('obsolete assertion not found')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/finalize-issue-39.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align issue #39 regression test with canonical source model"
          git push origin HEAD:fix/issue-39-finalize
