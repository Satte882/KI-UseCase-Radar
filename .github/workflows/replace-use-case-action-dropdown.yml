name: Replace Use Case Action Dropdown

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  replace:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Replace dropdown with buttons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('templates/use_cases/detail.html')
          text = path.read_text(encoding='utf-8')
          old = '''  <div class="dropdown">
    <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Weitere Aktionen</button>
    <ul class="dropdown-menu dropdown-menu-end">
      {% if can_edit %}<li><a class="dropdown-item" href="{% url 'use_cases:edit' use_case.pk %}">Stammdaten bearbeiten</a></li>{% endif %}
      {% if nav_is_coordinator %}<li><a class="dropdown-item" href="{% url 'reviews:create' use_case.pk %}">Lifecycle-Review</a></li>{% endif %}
      {% if nav_is_coordinator %}<li><a class="dropdown-item" href="{% url 'use_cases:assessment_create' use_case.pk %}">{% if latest_assessment %}Neue Bewertungsversion{% else %}Bewertung anlegen{% endif %}</a></li>{% endif %}
      {% if nav_is_coordinator and latest_assessment %}<li><a class="dropdown-item" href="{% url 'use_cases:approval_decision_create' use_case.pk %}">Freigabeentscheidung</a></li>{% endif %}
      {% if not can_edit and not nav_is_coordinator %}<li><span class="dropdown-item-text text-muted">Keine zusätzlichen Aktionen für deine Rolle.</span></li>{% endif %}
    </ul>
  </div>'''
          new = '''  <div class="d-flex flex-wrap gap-2 justify-content-end">
    {% if can_edit %}<a class="btn btn-outline-secondary" href="{% url 'use_cases:edit' use_case.pk %}">Stammdaten bearbeiten</a>{% endif %}
    {% if nav_is_coordinator %}<a class="btn btn-outline-secondary" href="{% url 'reviews:create' use_case.pk %}">Lifecycle-Review</a>{% endif %}
    {% if nav_is_coordinator %}<a class="btn btn-outline-secondary" href="{% url 'use_cases:assessment_create' use_case.pk %}">{% if latest_assessment %}Neue Bewertungsversion{% else %}Bewertung anlegen{% endif %}</a>{% endif %}
    {% if nav_is_coordinator and latest_assessment %}<a class="btn btn-outline-secondary" href="{% url 'use_cases:approval_decision_create' use_case.pk %}">Freigabeentscheidung</a>{% endif %}
  </div>'''
          if old not in text:
              raise SystemExit('Expected dropdown block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/use_cases/detail.html
          git commit -m "Show Use Case actions as buttons"
          git push