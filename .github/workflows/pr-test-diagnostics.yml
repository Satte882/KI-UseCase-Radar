name: PR Test Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: ki_radar_test
          POSTGRES_USER: ki_radar
          POSTGRES_PASSWORD: ki_radar_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ki_radar -d ki_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: diagnostic-only-secret
      POSTGRES_DB: ki_radar_test
      POSTGRES_USER: ki_radar
      POSTGRES_PASSWORD: ki_radar_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://ki_radar:ki_radar_test_password@localhost:5432/ki_radar_test
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --frozen --dev --quiet
      - name: Capture test output
        shell: bash
        run: |
          set +e
          uv run pytest -q > test-output.txt 2>&1
          printf '%s\n' "$?" > test-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test-output.txt
            test-exit-code.txt

  report:
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-output
      - name: Report test output
        shell: bash
        run: |
          cat test-output.txt
          exit "$(cat test-exit-code.txt)"
