name: Issue 379 formatter artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-artifact:
    if: github.head_ref == 'issue-379-llm-review-export'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Format issue files
        run: >-
          uv run ruff format
          ki_radar/review_export.py
          ki_radar/review_export_architecture.py
          ki_radar/review_export_use_cases.py
          tests/test_issue_379_llm_review_export.py

      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet -- \
            ki_radar/review_export.py \
            ki_radar/review_export_architecture.py \
            ki_radar/review_export_use_cases.py \
            tests/test_issue_379_llm_review_export.py; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ki_radar/review_export.py \
            ki_radar/review_export_architecture.py \
            ki_radar/review_export_use_cases.py \
            tests/test_issue_379_llm_review_export.py
          git commit -m "style: format #379 export files"
          git push origin HEAD:${{ github.head_ref }}
