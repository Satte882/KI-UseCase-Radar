name: Apply issue 37 admin exception

on:
  push:
    branches:
      - fix/issue-37-delivery-confirmation-roles

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-37-delivery-confirmation-roles
          fetch-depth: 0
      - name: Apply final patch
        run: python scripts/apply_issue37_admin_exception.py
      - name: Remove one-time patch mechanism
        run: |
          rm scripts/apply_issue37_admin_exception.py
          rm .github/workflows/apply-issue37-admin-exception.yml
      - name: Commit final product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Issue #37: Admin-Ausnahme eindeutig begrenzen"
          git push origin HEAD:fix/issue-37-delivery-confirmation-roles
