name: PR12 Targeted Diagnostics

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/process-analysis-solutions]

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: ki_radar_test
          POSTGRES_USER: ki_radar
          POSTGRES_PASSWORD: ki_radar_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ki_radar -d ki_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      POSTGRES_DB: ki_radar_test
      POSTGRES_USER: ki_radar
      POSTGRES_PASSWORD: ki_radar_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - run: uv sync --frozen --dev
      - name: Run targeted tests
        id: tests
        shell: bash
        run: |
          set +e
          uv run pytest tests/test_architecture_discovery.py tests/test_process_analysis.py -vv --tb=short > pr12-test.log 2>&1
          status=$?
          cat pr12-test.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: pr12-test-log
          path: pr12-test.log
      - name: Fail if tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
