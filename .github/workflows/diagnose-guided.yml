name: Diagnose Guided Workflow

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --frozen --dev
      - name: Capture diagnostics
        shell: bash
        run: |
          {
            echo '=== RUFF CHECK ==='
            uv run ruff check . || true
            echo '=== RUFF FORMAT ==='
            uv run ruff format --check . || true
          } > guided-diagnostics.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: guided-diagnostics
          path: guided-diagnostics.txt
