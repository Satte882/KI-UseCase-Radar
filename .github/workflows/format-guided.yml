name: Format Guided Workflow

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --frozen --dev
      - name: Apply Ruff formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ki_radar/use_cases/workflow.py')
          path.write_text(path.read_text().replace(' – ', ' - '), encoding='utf-8')
          PY
          uv run ruff format ki_radar/delivery/actions.py ki_radar/use_cases/workflow.py tests/test_guided_workflow_ux.py
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ki_radar/delivery/actions.py ki_radar/use_cases/workflow.py tests/test_guided_workflow_ux.py
          git commit -m "Format guided workflow changes"
          git push
