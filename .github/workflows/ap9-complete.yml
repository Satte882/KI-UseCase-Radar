name: Complete AP 9

on:
  push:
    branches:
      - issue-120-ap9-golden-regression

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: ki_radar_test
          POSTGRES_USER: ki_radar
          POSTGRES_PASSWORD: ki_radar_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ki_radar -d ki_radar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      POSTGRES_DB: ki_radar_test
      POSTGRES_USER: ki_radar
      POSTGRES_PASSWORD: ki_radar_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://ki_radar:ki_radar_test_password@localhost:5432/ki_radar_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-120-ap9-golden-regression
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - run: uv sync --frozen --dev
      - name: Apply completed AP 9 coverage
        run: echo '' | base64 --decode | python
      - run: uv run ruff format ki_radar/accelerator/extraction_contract.py tests/test_capture_analysis_golden.py
      - run: uv run ruff check ki_radar/accelerator/extraction_contract.py tests/test_capture_analysis_golden.py
      - name: Targeted AP 9 regression
        run: |
          uv run pytest \
            tests/test_capture_analysis_golden.py \
            tests/test_capture_analysis_service.py \
            tests/test_accelerator_llm.py \
            tests/test_extraction_contract.py \
            tests/test_extraction_validation.py \
            --no-cov
      - name: Commit completed AP 9
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ki_radar/accelerator/extraction_contract.py tests/test_capture_analysis_golden.py
          git commit -m "test(ap9): complete provider quota and size regressions"
          git push origin HEAD:issue-120-ap9-golden-regression
