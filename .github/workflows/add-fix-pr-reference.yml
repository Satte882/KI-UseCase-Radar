name: Add Fix PR reference

on:
  push:
    branches:
      - fix/accelerator-structured-output

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/accelerator-structured-output
      - name: Add concrete PR reference
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/accelerator/BLOCK_4_COMPLETION.md")
          text = path.read_text(encoding="utf-8")
          old = "Die Nachverfolgung erfolgt transparent in Issue #163 und einem separaten Fix-PR."
          new = "Die Nachverfolgung erfolgt transparent in Issue #163 und dem separaten Fix-PR #164."
          if old not in text:
              raise SystemExit("completion note anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/add-fix-pr-reference.yml
      - name: Commit final documentation reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(accelerator): link structured-output fix PR"
          git push origin HEAD:fix/accelerator-structured-output
