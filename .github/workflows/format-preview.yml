name: Format Preview

on:
  push:
    branches:
      - feature/outcome-workspace-ux-spike

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --dev
      - name: Format changed Python files
        run: |
          uv run ruff format \
            ki_radar/reporting/urls.py \
            ki_radar/reporting/views.py \
            ki_radar/use_cases/outcome_workspace.py \
            ki_radar/use_cases/templatetags/workflow_tags.py \
            tests/test_outcome_workspace_spike.py
      - name: Collect formatted files
        run: |
          mkdir -p formatted
          cp --parents \
            ki_radar/reporting/urls.py \
            ki_radar/reporting/views.py \
            ki_radar/use_cases/outcome_workspace.py \
            ki_radar/use_cases/templatetags/workflow_tags.py \
            tests/test_outcome_workspace_spike.py \
            formatted/
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-formatted-python
          path: formatted/
          if-no-files-found: error
