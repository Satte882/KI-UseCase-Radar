name: Ruff Format Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Format regression tests
        run: uv run ruff format tests/test_issue_51_64_primary_actions.py

      - name: Upload formatted file
        uses: actions/upload-artifact@v4
        with:
          name: issue-51-64-ruff-formatted
          path: tests/test_issue_51_64_primary_actions.py
          if-no-files-found: error
