name: Restore README Safely

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore previous README and apply targeted link label
        shell: bash
        run: |
          git show 35447e8731287720f77649152588e8d6c342528c:README.md > README.md
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = 'Die vollständige methodische Grundlage ist in [Delivery Methodology](docs/DELIVERY_METHODOLOGY.md) hinterlegt.'
          new = 'Die vollständige methodische Grundlage ist im [Vorgehensmodell für produktionsreife KI-Systeme](docs/DELIVERY_METHODOLOGY.md) hinterlegt.'
          if old not in text:
              raise SystemExit('README methodology link anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit restored README
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(delivery): restore README and name methodology reference"
          git push origin HEAD:${{ github.head_ref }}
