name: Format issue 38

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/issue-38-delivery-role-source-diff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-38-delivery-role-source-diff
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
      - name: Format implementation
        run: |
          uv sync --frozen --dev
          uv run ruff format ki_radar/delivery/services.py tests/test_delivery_readiness_v2.py
          uv run ruff check ki_radar/delivery/services.py tests/test_delivery_readiness_v2.py
          python -m compileall -q ki_radar/delivery/services.py tests/test_delivery_readiness_v2.py
          rm .github/workflows/format-issue-38.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format issue #38 implementation"
          git push origin HEAD:fix/issue-38-delivery-role-source-diff
