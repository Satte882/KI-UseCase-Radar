<div class="col-lg-6"><div class="card border-{{ style }}"><div class="card-header d-flex justify-content-between"><strong>{{ title }}</strong><span class="badge text-bg-{{ style }}">{{ items|length }}</span></div><div class="list-group list-group-flush">{% for item in items %}<a href="{{ item.get_absolute_url }}" class="list-group-item list-group-item-action"><strong>{{ item.short_id }}</strong> {{ item.title }}<span class="float-end">{{ item.next_review_date|date:"d.m.Y"|default:"–" }}</span></a>{% empty %}<div class="list-group-item text-muted">Keine Einträge.</div>{% endfor %}</div></div></div>
