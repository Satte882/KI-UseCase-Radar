{% load static %}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RSD Demo – KI-Ideenwerkstatt{% endblock %}</title>
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/demo-portal.css' %}">
</head>
<body class="presentation-page {% block body_class %}{% endblock %}">
  <header class="presentation-topbar">
    <a class="presentation-rsd-brand" href="{% url 'demo-portal' %}" aria-label="Zur RSD Demo-Startseite">
      <img src="{% static 'brand/rsd-logo.svg' %}" alt="RSD Reise Service Deutschland">
    </a>
    <div class="presentation-topbar-copy">
      <span>Vorbereitete Gesprächsunterlagen</span>
      <strong>KI-Ideenwerkstatt</strong>
    </div>
    <a class="presentation-app-link" href="{% url 'reporting:dashboard' %}">Zur Anwendung</a>
  </header>

  <main class="presentation-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
