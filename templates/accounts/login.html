{% extends "base.html" %}
{% block title %}Anmelden – KI-Radar{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h3 mb-3">KI-Radar</h1><p class="text-muted">Anmeldung</p>
    <form method="post">{% csrf_token %}{{ form.non_field_errors }}
      {% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
      <button class="btn btn-primary w-100">Anmelden</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
