<div class="{{ col|default:'col-12' }}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <div class="form-check mt-4">{{ field }}<label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label></div>
  {% else %}
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
    {{ field }}
  {% endif %}
  <div class="text-danger small">{{ field.errors }}</div>
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
</div>
